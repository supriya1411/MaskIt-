name: maskit

services:
  # ─── PostgreSQL ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: maskit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: maskit_user
      POSTGRES_PASSWORD: maskit_password
      POSTGRES_DB: maskit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maskit_user -d maskit_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: maskit_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── FastAPI Backend ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maskit_backend
    restart: unless-stopped
    # Port only exposed internally; nginx (frontend) proxies to backend:8000
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql://maskit_user:maskit_password@postgres:5432/maskit_db
      - REDIS_URL=redis://redis:6379/0
      - JWT_SECRET=super-secret-jwt-key-replace-in-production-min-32-chars
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - DEMO_MODE=false
      - CORS_ORIGINS=["http://localhost:8000"]
    env_file:
      - .env          # picks up GEMINI_API_KEY if present
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ─── React / Vite Frontend (served by nginx) ──────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: maskit_frontend
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
